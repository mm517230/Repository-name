
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aocai.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aocai.assistant'
        minSdk 23
        targetSdk 35
        versionCode 13
        versionName '1.3'
    }

    // 统一使用 Java 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 统一使用 Kotlin 17
    kotlinOptions {
        jvmTarget = '17'
    }
}
